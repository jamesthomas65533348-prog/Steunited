body{background:#050505;color:#fff;min-height:100vh;overflow-x:hidden}

.header-left,.header-right{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}

.header-center{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px}
.logo-badge{width:32px;height:32px;border-radius:50%;background:#0a0a0a;border:1px solid rgba(255,215,0,0.4);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(255,215,0,0.2)}
.logo-badge img{width:100%;height:100%;object-fit:cover}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:0.7}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px currentColor)}50%{filter:drop-shadow(0 0 10px currentColor)}}
.status-anim{animation:glow 2s infinite}
.status-anim.pending svg{animation:spin 2s linear infinite}
.status-anim.approved svg{animation:pulse 1.5s infinite}
.status-anim.rejected svg{animation:shake 0.6s infinite}

.tab-content{display:none}

.board{width:100%;aspect-ratio:3/4.6;background:linear-gradient(180deg,#0a1f0a,#123212);border-radius:24px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.12)}

.input{width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;margin-bottom:10px;outline:none}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}
async function savePushSubscription(reg, isAdmin=false){
  try{
    if(!reg || Notification.permission!=='granted') return
    const existing = await reg.pushManager.getSubscription()
    let sub = existing
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      })
    }
    const keys = sub.toJSON()
    const u = JSON.parse(localStorage.getItem('ste_user')||'null')
    await supabase.from('push_subscriptions').upsert({
      endpoint: keys.endpoint,
      keys: keys.keys,
      user_id: u?.id || 'guest',
      is_admin: isAdmin
    }, { onConflict: 'endpoint' })
    console.log('Push subscription saved')
  }catch(e){ console.log('Push save fail', e) }
}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;opacity:0.8"><div>First: ${u.first_name}</div><div>Rating: ${u.rating}</div><div>Main: ${u.main_position}</div><div>Status: ${u.status}</div></div>
    ${u.status==="approved"?`<div style="margin-top:14px;padding:12px;border-radius:14px;background:rgba(76,175,80,0.12);border:1px solid rgba(76,175,80,0.2);font-size:12px;display:flex;gap:8px;align-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>You are officially a STE UNITED player</div>`:""}
    ${u.status==="pending"?`<div style="margin-top:14px;display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;border-radius:14px;background:rgba(255,193,7,0.08)"><div class="status-anim pending" style="color:#FFC107"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC107" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><span style="font-size:13px">Waiting for admin approval...</span></div>`:""}
  `
}
async function loadAnnounce(){
  const {data}=await supabase.from("announcements").select("*").order("created_at",{ascending:false}).limit(1)
  if(data && data[0]) $("announcementBox").innerHTML=`<div class="announce"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2"><path d="M12 2a3 3 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg><span style="font-size:11px;font-weight:700;letter-spacing:1px;color:#FFD700">ANNOUNCEMENT</span></div><div style="font-size:14px;line-height:1.5">${data[0].message}</div></div>`
}
async function loadPlayers(){
  const {data}=await supabase.from("players").select("*").eq("status","approved").eq("is_admin",false).order("rating",{ascending:false})
  if(!data) return
  allPlayersData=data
  $("totalCount").textContent=data.length
  const maxRating = data.length?Math.max(...data.map(p=>p.rating)):0
  $("playersGrid").innerHTML=data.map(p=>{
    const col=getRatingColor(p.rating)
    const isHot=p.rating===maxRating && p.rating>=85
    return `<div class="player-card" onclick="openPlayerModal('${p.id}')">
      ${isHot?`<div class="hot">HOT</div>`:""}
      <div style="position:relative;display:inline-block"><div class="rating-badge" style="background:${col}"><svg width="10" height="10" viewBox="0 0 24 24" fill="black"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${p.rating}</div><div class="player-img"><img src="${p.photo_url}" onerror="this.src='background.png'"></div></div>
      <div style="font-weight:700;font-size:13px;margin-top:6px">${p.football_name}</div>
      <div style="font-size:11px;opacity:0.6">${p.sub_position} • #${p.jersey_number}</div>
      ${p.is_injured?`<div style="margin-top:6px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#ff8a8a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ff8a8a" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Injured</div>`:""}
    </div>`
  }).join("")
}
window.openPlayerModal=(id)=>{
  const p=allPlayersData.find(x=>x.id===id)
  if(!p) return
  const col=getRatingColor(p.rating)
  $("playerModal").innerHTML=`
    <div style="text-align:center">
      <div style="width:90px;height:90px;border-radius:50%;overflow:hidden;margin:0 auto 12px;border:3px solid ${col};box-shadow:0 0 20px ${col}55"><img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover"></div>
      <div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;background:${col};color:#000;font-weight:800;font-size:12px;margin-bottom:10px"><svg width="12" height="12" viewBox="0 0 24 24" fill="black"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${p.rating}</div>
      <h2 style="font-size:20px;font-weight:800">${p.football_name}</h2>
      <div style="opacity:0.6;font-size:13px;margin-top:2px">#${p.jersey_number} • ${p.sub_position}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left">
        <div class="glass-card" style="padding:12px;border-radius:16px"><div style="font-size:10px;opacity:0.5">FIRST NAME</div><div style="font-weight:700;font-size:13px">${p.first_name}</div></div>
        <div class="glass-card" style="padding:12px;border-radius:16px"><div style="font-size:10px;opacity:0.5">MAIN POS</div><div style="font-weight:700;font-size:13px">${p.main_position}</div></div>
        <div class="glass-card" style="padding:12px;border-radius:16px"><div style="font-size:10px;opacity:0.5">SUB POS</div><div style="font-weight:700;font-size:12px">${p.sub_position}</div></div>
        <div class="glass-card" style="padding:12px;border-radius:16px"><div style="font-size:10px;opacity:0.5">STATUS</div><div style="font-weight:700;font-size:12px;color:${p.is_injured?'#ff8a8a':'#4CAF50'}">${p.is_injured?'INJURED':'FIT'}</div></div>
      </div>
      <button class="btn-gold" style="margin-top:16px" onclick="closePlayerModal()">Close</button>
    </div>
  `
  $("playerModalBg").classList.add("open")
}
window.closePlayerModal=()=>{$("playerModalBg").classList.remove("open")}
async function loadFormation(){
  const {data:form}=await supabase.from("formations").select("*").eq("is_active",true).order("created_at",{ascending:false}).limit(1).maybeSingle()
  if(!form){$("formationBoard").innerHTML="<div style='display:flex;align-items:center;justify-content:center;height:100%;opacity:.4'>No active formation</div>";return}
  $("formationNameLabel").textContent = form.formation_name + " FORMATION"
  const {data:lineup}=await supabase.from("lineup").select("*, players(*)").eq("formation_id",form.id)
  const {data:injuredPlayers}=await supabase.from("players").select("*").eq("status","approved").eq("is_admin",false).eq("is_injured",true).order("rating",{ascending:false})
  const board=$("formationBoard"); board.innerHTML=""
  let subs=[]
  const injuredList = injuredPlayers || []
  $("injuredCount").textContent = injuredList.length
  $("injuredBox").innerHTML = injuredList.length? injuredList.map(p=>`
    <div class="sub-card" style="border-color:rgba(255,100,100,0.3)" onclick="openPlayerModal('${p.id}')">
      <div style="width:44px;height:44px;border-radius:50%;overflow:hidden;margin:0 auto 6px;position:relative;border:2px solid #ff5a5a">
        <img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;inset:0;background:rgba(255,0,0,0.25);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
      </div>
      <div style="font-size:12px;font-weight:600">${p.football_name}</div>
      <div style="font-size:10px;color:#ff8a8a">#${p.jersey_number} • ${p.sub_position}</div>
    </div>`).join("") : "<div style='opacity:0.4;font-size:12px;padding:10px'>No injured players</div>"
  if(lineup){
    lineup.forEach(l=>{
      if(!l.players) return
      if(l.players.is_injured) return
      if(!l.is_starter){subs.push(l);return}
      const div=document.createElement("div"); div.className="field-player"; div.style.left=l.pos_x+"%"; div.style.top=l.pos_y+"%";
      div.innerHTML=`<div class="p-img"><img src="${l.players.photo_url}" onerror="this.src='background.png'"></div><div class="p-name">${l.players.football_name}</div><div class="p-pos">${l.position_label||""}</div>`
      div.onclick=()=>openPlayerModal(l.players.id); board.appendChild(div)
    })
  }
  $("subsCount").textContent = subs.length
  $("subsBox").innerHTML=subs.length? subs.map(s=>`<div class="sub-card" onclick="openPlayerModal('${s.players.id}')"><div style="width:44px;height:44px;border-radius:50%;overflow:hidden;margin:0 auto 6px;border:2px solid rgba(255,215,0,0.4)"><img src="${s.players.photo_url}" style="width:100%;height:100%;object-fit:cover"></div><div style="font-size:12px;font-weight:600">${s.players.football_name}</div><div style="font-size:10px;opacity:0.6">${s.position_label}</div></div>`).join("") : "<div style='opacity:0.4;font-size:12px;padding:10px'>No substitutes set</div>"
}
loadAnnounce();loadPlayers();loadFormation()

const liveChannel = supabase.channel('ste-live-push')
 .on('postgres_changes', {event:'INSERT', schema:'public', table:'players'}, payload=>{
    const p=payload.new
    if(p.status==='approved'){
      loadPlayers()
      showLocalNotif(`New Player: ${p.football_name}`, `${p.football_name} #${p.jersey_number} joined STE UNITED - Rating ${p.rating}`)
      popup(`New player approved: ${p.football_name}`)
    }
 })
 .on('postgres_changes', {event:'UPDATE', schema:'public', table:'players'}, payload=>{
    const oldP=payload.old, newP=payload.new
    if(currentUser && newP.id===currentUser.id){
      localStorage.setItem("ste_user", JSON.stringify(newP))
      currentUser=newP
      updateHeaderForUser(newP)
      if(oldP.status!==newP.status && newP.status==='approved'){
        showLocalNotif(`🎉 ${newP.football_name} Approved!`, `You are now officially STE UNITED player!`)
      }
    }
    if(oldP.rating!==newP.rating){
      const diff=newP.rating-oldP.rating
      const up=diff>0
      showLocalNotif(`${newP.football_name} Rating ${up?'↑':'↓'} ${newP.rating}`, `Rating ${oldP.rating} → ${newP.rating} (${diff>0?'+':''}${diff})`)
    }
    if(oldP.is_injured!==newP.is_injured){
      showLocalNotif(`${newP.football_name} ${newP.is_injured?'Injured 🤕':'Back Fit 💪'}`, `${newP.football_name} is now ${newP.is_injured?'injured':'fit'}`)
    }
    loadPlayers()
    loadFormation()
 })
 .on('postgres_changes', {event:'*', schema:'public', table:'announcements'}, payload=>{
    if(payload.eventType==='INSERT'){
      loadAnnounce()
      showLocalNotif(`📢 New Announcement`, payload.new.message.substring(0,80))
      popup("New announcement")
    }
 })
 .on('postgres_changes', {event:'*', schema:'public', table:'formations'}, payload=>{
    if(payload.eventType==='INSERT' || payload.eventType==='UPDATE'){
      loadFormation()
      showLocalNotif(`Formation Updated`, `${payload.new?.formation_name||'New formation'} is now active`)
    }
 })
 .on('postgres_changes', {event:'*', schema:'public', table:'lineup'}, ()=>{
    loadFormation()
    showLocalNotif(`Lineup Changed`, `Starting XI updated by admin`)
 })
 .subscribe()

document.querySelectorAll(".tab-btn").forEach(btn=>{btn.onclick=()=>{if(isGuest) return popup("Login first"); document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active")); document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active")); btn.classList.add("active"); $(btn.dataset.tab).classList.add("active")}})
$("logoutBtn").onclick=()=>{supabase.removeChannel(liveChannel); localStorage.removeItem("ste_user");location.href="auth.html"}
</script>
</body>
</html>
